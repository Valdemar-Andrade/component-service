spring.application.name=component-service
server.port=8083

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/component_db
spring.datasource.username=
spring.datasource.password=

# KAFKA
spring.kafka.consumer.group-id=component-group
app.kafka.topic=industria-carro

# Para que o consumidor ignore erros de desserialização e não entre em loop
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Mapeamento para garantir que ele entenda o BaseEvent de outros pacotes
spring.kafka.consumer.properties.spring.json.type.mapping=base_event:com.projeto.componentservice.dto.BaseEvent

